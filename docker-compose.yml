services:
  doubannotionsync:
    build:
      context: .
      dockerfile: Dockerfile
    image: doubannotionsync:latest
    working_dir: /app
    volumes:
      - ./src/config.yaml:/app/src/config.yaml:ro
      - poster-cache:/app/posters
    command: ["python", "-m", "src.main"]

volumes:
  poster-cache:
