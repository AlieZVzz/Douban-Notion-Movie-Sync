[project]
name = "doubannotionsync"
version = "0.1.0"
description = "Reliably synchronize watched movies from Douban RSS to Notion"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "beautifulsoup4==4.12.3",
    "feedparser==6.0.11",
    "pillow==11.0.0",
    "pyyaml==6.0.2",
    "requests==2.32.3",
    "urllib3==2.2.3",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.3",
    "pytest-cov==5.0.0",
    "ruff==0.7.3",
]

[project.scripts]
doubannotionsync = "src.main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["src", "src.api"]
include-package-data = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py39"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
